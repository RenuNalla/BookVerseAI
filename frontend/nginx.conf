server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular client-side routing: always fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy so the browser talks to /api on the same origin,
    # avoiding CORS entirely in production.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}