<section class="bg-surface-muted py-5 min-vh-100 d-flex align-items-center">
  <div class="container" style="max-width: 420px;">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4 p-md-5">
        <h4 class="fw-semibold mb-1">Welcome back</h4>
        <p class="text-muted small mb-4">Log in to continue to your library.</p>

        <div class="alert alert-danger py-2 small" *ngIf="errorMessage">{{ errorMessage }}</div>

        <form [formGroup]="form" (ngSubmit)="submit()">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Email</label>
            <input
              type="email"
              class="form-control"
              formControlName="email"
              placeholder="you@example.com"
            />
            <div
              class="text-danger small mt-1"
              *ngIf="form.get('email')?.touched && form.get('email')?.invalid"
            >
              Enter a valid email address.
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label small fw-semibold">Password</label>
            <input type="password" class="form-control" formControlName="password" placeholder="••••••••" />
            <div
              class="text-danger small mt-1"
              *ngIf="form.get('password')?.touched && form.get('password')?.invalid"
            >
              Password must be at least 8 characters.
            </div>
          </div>

          <button type="submit" class="btn btn-brand w-100 py-2" [disabled]="loading">
            {{ loading ? 'Logging in...' : 'Log in' }}
          </button>
        </form>

        <p class="text-center small text-muted mt-4 mb-0">
          Don't have an account? <a routerLink="/register">Sign up</a>
        </p>
      </div>
    </div>
  </div>
</section>
