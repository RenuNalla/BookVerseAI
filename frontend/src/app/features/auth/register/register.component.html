<section class="bg-surface-muted py-5 min-vh-100 d-flex align-items-center">
  <div class="container" style="max-width: 420px;">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4 p-md-5">
        <h4 class="fw-semibold mb-1">Create your account</h4>
        <p class="text-muted small mb-4">Start translating and building your library.</p>

        <div class="alert alert-danger py-2 small" *ngIf="errorMessage">{{ errorMessage }}</div>

        <form [formGroup]="form" (ngSubmit)="submit()">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Full name</label>
            <input type="text" class="form-control" formControlName="full_name" placeholder="Name" />
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold">Email</label>
            <input type="email" class="form-control" formControlName="email" placeholder="you@example.com" />
          </div>

          <div class="mb-4">
            <label class="form-label small fw-semibold">Password</label>
            <div class="position-relative">
              <input
                [type]="showPassword ? 'text' : 'password'"
                class="form-control pe-5"
                formControlName="password"
                placeholder="At least 8 characters"
                autocomplete="new-password"
              />
              <button
                type="button"
                class="btn btn-link btn-sm position-absolute end-0 top-50 translate-middle-y me-2"
                (click)="togglePasswordVisibility()"
              >
                {{ showPassword ? 'Hide' : 'Show' }}
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-brand w-100 py-2" [disabled]="loading">
            {{ loading ? 'Creating account...' : 'Sign up' }}
          </button>
        </form>

        <p class="text-center small text-muted mt-4 mb-0">
          Already have an account? <a routerLink="/login">Log in</a>
        </p>
      </div>
    </div>
  </div>
</section>
