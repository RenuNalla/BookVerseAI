<div class="container-fluid py-4 px-4">
  <div class="row">
    <!-- Sidebar, mirrors the Kindle screenshot's left nav -->
    <aside class="col-12 col-md-3 col-lg-2 mb-4 mb-md-0">
      <h6 class="text-uppercase text-muted small mb-3">Library</h6>
      <div class="list-group list-group-flush">
        <button
          *ngFor="let filter of filters"
          type="button"
          class="list-group-item list-group-item-action border-0 rounded-2 mb-1"
          [class.bg-surface-muted]="activeFilter === filter"
          [class.fw-semibold]="activeFilter === filter"
          (click)="setFilter(filter)"
        >
          {{ filter }}
        </button>
      </div>
    </aside>

    <!-- Book grid -->
    <main class="col-12 col-md-9 col-lg-10">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h5 class="mb-0">{{ activeFilter }}</h5>
        <input
          type="search"
          class="form-control form-control-sm"
          style="max-width: 240px;"
          placeholder="Search your library"
        />
      </div>

      <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-4">
        <div class="col" *ngFor="let book of books">
          <div class="card border-0 h-100">
            <div
              class="rounded-3 mb-2"
              style="aspect-ratio: 2/3;"
              [style.backgroundColor]="book.coverColor"
            ></div>
            <div class="card-body p-0">
              <p class="mb-0 small fw-semibold text-truncate">{{ book.title }}</p>
              <p class="mb-0 small text-muted">{{ book.author }}</p>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
